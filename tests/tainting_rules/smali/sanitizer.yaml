rules:
  - id: smali-sanitizer
    languages: [smali]
    severity: WARNING
    message: unsanitised value reaches a sink
    mode: taint
    pattern-sources:
      - pattern: invoke-virtual {$I}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
    pattern-sanitizers:
      - pattern: invoke-static {$X}, Landroid/database/DatabaseUtils;->sqlEscapeString(Ljava/lang/String;)Ljava/lang/String;
    pattern-sinks:
      - pattern: invoke-virtual {$D, $SQL}, Landroid/database/sqlite/SQLiteDatabase;->execSQL(Ljava/lang/String;)V
